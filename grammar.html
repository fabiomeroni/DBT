<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparative Grammar</title>
<script src="/project.js"></script>
<script src="/colors.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="grammar.css">
</head>
<body>

<!-- ── New section modal ── -->
<div class="dbt-modal-backdrop" id="new-section-modal">
  <div class="dbt-modal">
    <h3>Add grammar section</h3>
    <p class="modal-desc">Enter a title for the new section. A section ID will be generated automatically.</p>
    <input type="text" id="new-section-title" placeholder="e.g. §2 Pronouns"
           style="width:100%;font-family:'Crimson Pro',serif;font-size:1rem;
                  padding:6px 10px;border:1px solid var(--border);border-radius:3px;
                  outline:none;box-sizing:border-box;margin-bottom:0.75rem;">
    <div class="dbt-modal-msg" id="new-section-msg"></div>
    <div class="dbt-modal-row">
      <button class="modal-btn" id="new-section-cancel">Cancel</button>
      <button class="modal-btn primary" id="new-section-submit">Create</button>
    </div>
  </div>
</div>

<!-- ── Login modal ── -->
<div class="dbt-modal-backdrop" id="login-modal">
  <div class="dbt-modal">
    <h3>Author login</h3>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password">
    <div class="dbt-modal-msg" id="login-msg"></div>
    <div class="dbt-modal-row">
      <button class="modal-btn" id="login-cancel">Cancel</button>
      <button class="modal-btn primary" id="login-submit">Log in</button>
    </div>
  </div>
</div>

<nav class="topnav">
  <a class="topnav-brand" href="index.html">◬ {{project.name}}</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="grammar.html" class="active">Grammar</a></li>
    <li><a href="texts.html">Texts</a></li>
    <li><a href="dictionary.html">Dictionary</a></li>
    <li><a href="references.html">References</a></li>
    <li><a href="glossary.html">Glossary</a></li>
  </ul>
  <div class="topnav-auth">
    <button class="auth-btn login-btn" title="Author login">🔒 Author</button>
    <button class="auth-btn logout-btn" style="display:none;">Logout</button>
  </div>
  <div class="topnav-right">{{project.nav.grammar}}</div>
</nav>

<div class="grammar-shell">

  <!-- ── Sidebar ── -->
  <aside class="grammar-sidebar">
    <span class="sidebar-section-label">Contents</span>
    <ul class="toc-list" id="toc-list">
      <!-- populated dynamically after sections load -->
    </ul>
    <button class="sidebar-add-btn" id="add-section-btn">＋ Add section</button>

    <a href="/api/grammar/export/latex" download="grammar.tex"
       style="display:block;margin:0.6rem 1rem 0;
              font-family:'Crimson Pro',serif;font-size:0.78rem;
              color:var(--ink-light);text-align:center;
              border:1px solid var(--border);border-radius:3px;
              padding:4px 0 5px;text-decoration:none;
              transition:color 0.12s,border-color 0.12s,background 0.12s;"
       onmouseover="this.style.color='var(--gold)';this.style.borderColor='var(--gold)'"
       onmouseout="this.style.color='';this.style.borderColor=''">
      ⬇ Export LaTeX
    </a>

    <div class="sidebar-lang-head">
      <span class="sidebar-section-label">Show languages</span>
    </div>
    <div class="lang-pills-wrap" id="lang-pills"></div>
  </aside>

  <!-- ── Main ── -->
  <main class="grammar-main">
    <!-- TOC overview — shown before grammar sections, built dynamically -->
    <div class="toc-intro" id="toc-intro" style="display:none;">
      <h2>Contents</h2>
      <ol id="toc-intro-list"></ol>
    </div>

    <div id="sections-container"></div>
  </main>

</div>

<script src="auth.js"></script>
<script src="phonotable.js"></script>
<script src="editor.js"></script>
<script>
'use strict';

// The languages come from the project (project/project.json, through /project.js)
const LANGS  = DBT.names;
const COLORS = DBT.colorByName;

let activeLangs = new Set(LANGS);

function onAuthChange(loggedIn) {
  // Add-section sidebar button
  const addBtn = document.getElementById('add-section-btn');
  if (addBtn) addBtn.classList.toggle('visible', loggedIn);
  // Per-section delete buttons
  document.querySelectorAll('.delete-tab').forEach(b =>
    b.classList.toggle('visible', loggedIn)
  );
}

// ── Language toggle pills ──────────────────────────────────────
function buildLangPills() {
  const wrap = document.getElementById('lang-pills');
  if (!wrap) return;
  LANGS.forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'lang-pill active';
    btn.textContent = lang;
    btn.style.background = COLORS[lang];
    btn.dataset.lang = lang;
    btn.addEventListener('click', () => {
      if (activeLangs.has(lang)) {
        if (activeLangs.size === 1) return;
        activeLangs.delete(lang);
        btn.classList.remove('active');
      } else {
        activeLangs.add(lang);
        btn.classList.add('active');
      }
      applyLangFilter();
    });
    wrap.appendChild(btn);
  });
}

function applyLangFilter() {
  document.querySelectorAll('tr[data-lang]').forEach(row => {
    row.classList.toggle('lang-hidden', !activeLangs.has(row.dataset.lang));
  });
}

// ── TOC builder ────────────────────────────────────────────────
// Called after all sections have loaded. Scans every h2/h3 that has
// an id (added by Python-Markdown's toc extension) and builds:
//   • the sidebar .toc-list  (compact, scrollspy-linked)
//   • the .toc-intro block   (shown at top of main content)
function buildTOC() {
  const sideList  = document.getElementById('toc-list');
  const introList = document.getElementById('toc-intro-list');
  const intro     = document.getElementById('toc-intro');
  sideList.innerHTML  = '';
  introList.innerHTML = '';

  const headings = document.querySelectorAll(
    '#sections-container h2[id], #sections-container h3[id]'
  );

  if (!headings.length) return;

  headings.forEach(h => {
    const level  = h.tagName.toLowerCase(); // 'h2' or 'h3'
    const anchor = h.id;
    const text   = h.textContent.trim();

    // ── Sidebar entry ──
    const li = document.createElement('li');
    li.className = level === 'h3' ? 'toc-h3' : '';
    const a = document.createElement('a');
    a.href = '#' + anchor;
    a.textContent = text;
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    li.appendChild(a);
    sideList.appendChild(li);

    // ── Intro block entry ──
    const li2 = document.createElement('li');
    li2.className = level === 'h3' ? 'intro-h3' : '';
    const a2 = document.createElement('a');
    a2.href = '#' + anchor;
    a2.textContent = text;
    a2.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    li2.appendChild(a2);
    introList.appendChild(li2);
  });

  intro.style.display = '';
}

// ── Section loading ────────────────────────────────────────────
async function loadSection(id) {
  const container = document.getElementById('sections-container');
  const wrap = document.createElement('div');
  wrap.className = 'grammar-section';
  wrap.id = id;
  wrap.innerHTML = `
    <button class="delete-tab${isLoggedIn ? ' visible' : ''}"
            onclick="deleteSection('${id}')"
            title="Delete this section">🗑 Delete</button>
    <button class="edit-tab section-edit${isLoggedIn ? ' visible' : ''}" onclick="enterEditMode('${id}')"
            title="Edit this section">✏ Edit</button>
    <div class="section-content" id="content-${id}">
      <p class="section-loading">Loading…</p>
    </div>
    ${mdEditorHTML(id, { onCancel: 'cancelEdit', onSave: 'saveSection', saveLabel: 'Save &amp; render' })}`;
  container.appendChild(wrap);
  PhonoEditor.tabs(id);
  PhonoEditor.mount(id);

  try {
    const resp = await fetch('/api/grammar/' + id);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    document.getElementById('content-' + id).innerHTML = data.html;
    applyLangFilter();
    bindDictLinksInSection(document.getElementById('content-' + id));
    bindDictLinksInSection(document.getElementById('content-' + id));
  } catch(e) {
    document.getElementById('content-' + id).innerHTML =
      '<p class="section-error">Could not load section ' + id + ': ' + e.message + '</p>';
  }
}

// The tables and the figures are numbered through the whole grammar, so when one section changes the others are shown again with their new numbers
async function renumberOthers(exceptId) {
  for (const el of document.querySelectorAll('#sections-container .grammar-section')) {
    const sid = el.id;
    if (!sid || sid === exceptId) continue;
    const box = document.getElementById('content-' + sid);
    if (!box || box.style.display === 'none') continue;               // a section that is being edited is left alone
    try {
      const d = await (await fetch('/api/grammar/' + sid)).json();
      if (d.html && d.html !== box.innerHTML) { box.innerHTML = d.html; bindDictLinksInSection(box); }
    } catch (e) { /* the next save will do it */ }
  }
  applyLangFilter();
}

// ── Edit mode ──────────────────────────────────────────────────
async function enterEditMode(id) {
  if (!isLoggedIn) { showLoginModal(); return; }
  try {
    const resp = await fetch('/api/grammar/' + id + '/source');
    if (resp.status === 401) { showLoginModal(); return; }
    const data = await resp.json();
    document.getElementById('textarea-' + id).value = data.source;
    PhonoEditor.showText(id);
    document.getElementById('content-' + id).style.display = 'none';
    document.getElementById('editor-' + id).classList.add('visible');
  } catch(e) { alert('Could not load source: ' + e.message); }
}

async function saveSection(id) {
  const source = document.getElementById('textarea-' + id).value;
  try {
    const resp = await fetch('/api/grammar/' + id, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({source})
    });
    const data = await resp.json();
    if (data.ok) {
      document.getElementById('content-' + id).innerHTML = data.html;
      applyLangFilter();
      cancelEdit(id);
      buildTOC(); // headings may have changed
      renumberOthers(id); // a table or a figure more or less here changes the numbers of those that follow
    }
  } catch(e) { alert('Save failed: ' + e.message); }
}

function cancelEdit(id) {
  document.getElementById('content-' + id).style.display = '';
  document.getElementById('editor-' + id).classList.remove('visible');
}

// ── Editor helpers ─────────────────────────────────────────────

// a link such as grammar.html#tab-consonants goes to the table or the figure, once the sections are on the page
function scrollToHash() {
  if (location.hash.length < 2) return;
  const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 60);
}

// ── Delete section ─────────────────────────────────────────────
async function deleteSection(id) {
  if (!isLoggedIn) { showLoginModal(); return; }
  // Get the section heading text for the confirmation message
  const heading = document.querySelector(`#${id} h2, #${id} h3`);
  const label   = heading ? heading.textContent.trim() : id;
  if (!confirm(`Delete section "${label}"?\n\nThis cannot be undone.`)) return;
  try {
    const resp = await fetch(`/api/grammar/${id}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    // Remove from DOM and rebuild TOC
    document.getElementById(id)?.remove();
    buildTOC();
    renumberOthers(id);
  } catch(e) { alert('Delete failed: ' + e.message); }
}

// ── Add new section ────────────────────────────────────────────
function bindAddSection() {
  const btn    = document.getElementById('add-section-btn');
  const modal  = document.getElementById('new-section-modal');
  const input  = document.getElementById('new-section-title');
  const msg    = document.getElementById('new-section-msg');
  const cancel = document.getElementById('new-section-cancel');
  const submit = document.getElementById('new-section-submit');

  btn.addEventListener('click', () => {
    if (!isLoggedIn) { showLoginModal(); return; }
    input.value = ''; msg.textContent = '';
    modal.classList.add('visible');
    setTimeout(() => input.focus(), 60);
  });
  cancel.addEventListener('click', () => modal.classList.remove('visible'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('visible'); });

  async function doCreate() {
    const title = input.value.trim();
    if (!title) { msg.textContent = 'Please enter a title.'; msg.className='dbt-modal-msg error'; return; }
    msg.textContent = ''; msg.className = 'dbt-modal-msg';
    try {
      const r = await fetch('/api/grammar', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ title })
      });
      const d = await r.json();
      if (d.ok) {
        modal.classList.remove('visible');
        await loadSection(d.id);
        buildTOC();
      } else {
        msg.textContent = d.error || 'Failed to create section.';
        msg.className = 'dbt-modal-msg error';
      }
    } catch(e) {
      msg.textContent = 'Error: ' + e.message;
      msg.className = 'dbt-modal-msg error';
    }
  }

  submit.addEventListener('click', doCreate);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });
}

// ── Scrollspy — tracks headings, not just sections ─────────────
function bindScrollspy() {
  window.addEventListener('scroll', () => {
    const headings = document.querySelectorAll(
      '#sections-container h2[id], #sections-container h3[id]'
    );
    let activeId = null;
    headings.forEach(h => {
      if (h.getBoundingClientRect().top < 130) activeId = h.id;
    });
    document.querySelectorAll('.toc-list a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + activeId);
    });
  }, {passive: true});
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  buildLangPills();
  bindLoginModal();
  await Promise.all([checkAuth(), loadGrammarDict()]);

  const secResp = await fetch('/api/grammar')
    .then(r => r.json())
    .catch(() => ({ sections: [{ id: 's1' }] }));

  for (const sec of secResp.sections) await loadSection(sec.id);

  // Re-apply auth visibility now that section buttons exist in the DOM
  updateAuthUI();

  buildTOC();
  bindScrollspy();
  bindAddSection();
  scrollToHash();
});

// ── Dictionary lookup for cited examples ─────────────────────
const G_LANG_COLORS = DBT.colorByName;
const G_ABBRS = DBT.abbrByName;
const G_CODE2LANG = DBT.nameFromFileCode;
const G_LANGS = DBT.names;
const G_CODES = DBT.codeByName;
let gDictById = {}, gDictByForm = {}, gHideTimer = null;

async function loadGrammarDict() {
  try {
    const r = await fetch('/api/dictionary/entries');
    if (!r.ok) return;
    const d = await r.json();
    (d.entries||[]).forEach(e => {
      gDictById[e.id] = e;
      Object.entries(e.forms||{}).forEach(([lang, form]) => {
        if (!form || form==='—') return;
        gDictByForm[`${lang}:${form.toLowerCase()}`] = e;
        const clean = form.replace(/^[-=]+|[-=.,;]+$/g,'').toLowerCase();
        if (clean !== form.toLowerCase()) gDictByForm[`${lang}:${clean}`] = e;
      });
    });
  } catch(e) {}
}

function showGrammarTooltip(anchor, entry) {
  if (!entry) return;
  const tt = document.getElementById('grammar-tooltip');
  const senses = entry.senses || [];
  const line = senses.length > 1 ? senses.map(s => `${s.n}. ${s.gloss}`).join('   ') : (entry.gloss || entry.id);
  document.getElementById('gtt-hw').textContent  = line;
  document.getElementById('gtt-def').textContent =
    (senses.length === 1 && senses[0].definition && senses[0].definition !== line) ? senses[0].definition : '';
  document.getElementById('gtt-equivs').innerHTML = G_LANGS.map(lang => {
    const col = G_LANG_COLORS[lang]||'#888', form = entry.forms?.[G_CODES[lang]]||'—';
    return `<span style="font-family:'Source Code Pro',monospace;font-size:.7rem;
      background:rgba(255,255,255,.09);border-radius:2px;padding:1px 5px;">
      <b style="color:${col};">${G_ABBRS[lang]}</b> ${form}</span>`;
  }).join('');
  tt.style.opacity = '1';
  const rect = anchor.getBoundingClientRect(), tw = 280;
  let left = rect.left + rect.width/2 - 20;
  if (left + tw > window.innerWidth-8) left = window.innerWidth-tw-8;
  if (left < 8) left = 8;
  const ttH = tt.offsetHeight||90;
  tt.style.left = left + 'px';
  tt.style.top  = (rect.top-ttH-8 < 8)
    ? (rect.bottom+8+window.scrollY)+'px'
    : (rect.top-ttH-8+window.scrollY)+'px';
}
function hideGrammarTooltip() {
  clearTimeout(gHideTimer);
  gHideTimer = setTimeout(() => {
    const tt = document.getElementById('grammar-tooltip');
    if (tt) tt.style.opacity = '0';
  }, 80);
}

function bindDictLinksInSection(container) {
  if (!container) return;
  // lexlinks from {{example:}} already have href — just add hover preview
  container.querySelectorAll('a.lexlink[data-dict-id]').forEach(el => {
    const entry = gDictById[el.dataset.dictId];
    if (!entry) return;
    el.addEventListener('mouseenter', () => { clearTimeout(gHideTimer); showGrammarTooltip(el, entry); });
    el.addEventListener('mouseleave', hideGrammarTooltip);
  });
  // Cited words that carry an explicit dictionary entry (data-dict-id): link them directly,
  // whatever orthography the dictionary happens to be written in.
  container.querySelectorAll('td[data-dict-id]').forEach(el => {
    const entry = gDictById[el.dataset.dictId];
    if (!entry) return;
    el.style.cursor = 'pointer';
    el.style.textDecorationLine = 'underline';
    el.style.textDecorationStyle = 'dotted';
    el.addEventListener('mouseenter', () => { clearTimeout(gHideTimer); showGrammarTooltip(el, entry); });
    el.addEventListener('mouseleave', hideGrammarTooltip);
    el.addEventListener('click', () => {
      const langName = G_CODE2LANG[el.dataset.lang] || el.dataset.lang;
      window.location.href = `dictionary.html?lang=${encodeURIComponent(langName)}#${entry.id}`;
    });
  });

  // Form cells from {{cite:}} — data-lang + data-form
  container.querySelectorAll('[data-lang][data-form]').forEach(el => {
    if (el.dataset.dictId) return;            // already linked explicitly above
    const lang = el.dataset.lang, form = el.dataset.form;
    if (!form || form==='—' || form==='—') return;
    const clean = form.replace(/^[-=]+|[-=.,;]+$/g,'').toLowerCase();
    const entry = gDictByForm[`${lang}:${form.toLowerCase()}`]||gDictByForm[`${lang}:${clean}`];
    if (!entry) return;
    // Cited words carry their column's gloss. Link by form only when that gloss agrees with the
    // entry's gloss, so a homophone (same form, different gloss) is never tied to the wrong
    // entry; an unglossed word is not linked until it has been glossed.
    if (el.hasAttribute('data-gloss')) {
      const gl = (el.dataset.gloss || '').trim().toLowerCase();
      const gs = (entry.glosses && entry.glosses.length ? entry.glosses : [entry.gloss || '']).map(x => x.trim().toLowerCase());
      if (!gl || !gs.includes(gl)) return;      // the gloss must be one of the entry's senses
    }
    el.style.cursor = 'pointer';
    el.style.textDecorationLine = 'underline';
    el.style.textDecorationStyle = 'dotted';
    el.addEventListener('mouseenter', () => { clearTimeout(gHideTimer); showGrammarTooltip(el, entry); });
    el.addEventListener('mouseleave', hideGrammarTooltip);
    el.addEventListener('click', () => {
      const langName = G_CODE2LANG[lang]||lang;
      window.location.href = `dictionary.html?lang=${encodeURIComponent(langName)}#${entry.id}`;
    });
  });
}


// ── hovering a {{source: …}} citation shows the full reference ──
(function () {
  let tt = null;
  function show(a) {
    if (!tt) {
      tt = document.createElement('div');
      tt.style.cssText = 'position:fixed;z-index:400;max-width:min(430px,86vw);background:#1c0f06;color:#f0dfc0;font:0.92rem/1.45 "EB Garamond",serif;' +
                         'padding:8px 12px;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none;display:none;overflow-wrap:anywhere;';
      document.body.appendChild(tt);
    }
    tt.innerHTML = a.dataset.ref || '';
    tt.querySelectorAll('a').forEach(l => { l.style.color = '#e8c887'; });
    tt.style.display = 'block';
    const r = a.getBoundingClientRect(), w = tt.offsetWidth, h = tt.offsetHeight;
    let y = r.bottom + 6; if (y + h > innerHeight - 8) y = r.top - h - 6;
    tt.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
    tt.style.top = Math.max(8, y) + 'px';
  }
  document.addEventListener('mouseover', e => { const a = e.target.closest && e.target.closest('.source-cite'); if (a) show(a); });
  document.addEventListener('mouseout',  e => { if (tt && e.target.closest && e.target.closest('.source-cite')) tt.style.display = 'none'; });
})();
</script>

<!-- ── Dictionary hover tooltip (for cited examples) ── -->
<div id="grammar-tooltip" role="tooltip" aria-hidden="true" style="
  position:fixed;z-index:9999;pointer-events:none;
  opacity:0;transition:opacity 0.08s ease;max-width:300px;">
  <div style="background:#1c0f06;color:#f0dfc0;border-radius:5px;
              padding:9px 14px 10px;
              box-shadow:0 4px 18px rgba(0,0,0,.38),0 0 0 1px rgba(201,164,88,.25);
              font-family:'Crimson Pro',serif;font-size:0.9rem;line-height:1.5;">
    <div id="gtt-hw"     style="font-family:'EB Garamond',serif;font-size:1.1rem;font-weight:500;color:#fdeec8;"></div>
    <div id="gtt-def"    style="color:#e8d0a8;margin-top:3px;font-size:0.86rem;"></div>
    <div id="gtt-equivs" style="margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;"></div>
  </div>
</div>
